version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
# Updates are proposed as pull requests, never automatically merged.
# Keep requirements.txt and requirements.lock consistent when reviewing Python updates.
