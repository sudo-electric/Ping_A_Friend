services:
  ping-a-friend:
    build: .
    ports:
      - "${PAF_BIND_IP:-0.0.0.0}:8000:8000"
    environment:
      PAF_CONFIG: /data/config.json
      PAF_DB: /data/ping_a_friend.sqlite3
      PAF_ACCESS_KEY_FILE: /data/access.key
    volumes:
      - paf-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  paf-data:
